services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d salamandra"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crm-net

  # ── Next.js app ─────────────────────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      # El CRM se escribió y se prueba en Europe/Madrid; sin esto el contenedor
      # corre en UTC y 42 ficheros del servidor que usan fechas locales sin zona
      # (el año del número de factura, el «hoy» de la portada, los trimestres,
      # PDFs, exportaciones) iban una o dos horas por detrás. Va AQUÍ y no en
      # .env.production porque ese fichero lo comparte el contenedor de Postgres
      # y le cambiaría la zona al servidor de base de datos (19/08/2026).
      - TZ=Europe/Madrid
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"   # solo accesible desde el propio VPS (nginx nativo hace de proxy)
    volumes:
      # Almacenamiento persistente de archivos subidos por usuarios
      # (PDFs adjuntos a clientes, etc.). Path host puede personalizarse
      # con UPLOADS_HOST_DIR en .env.production; default ./uploads relativo
      # a docker-compose.yml.
      - ${UPLOADS_HOST_DIR:-./uploads}:/app/uploads
    networks:
      - crm-net

volumes:
  pgdata:

networks:
  crm-net:
    driver: bridge
