worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Límite de cuerpo para uploads (30M: los adjuntos de Documentos llegan a
    # 25 MB — ver docs/modules/documents.md). Es el valor que ya corría en el VPS.
    client_max_body_size 30M;

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Upstream: Next.js ───────────────────────────────────────────────────
    upstream nextjs {
        server app:3000;
    }

    # ── HTTP → HTTPS redirect (activar cuando tengas dominio + certificado) ─
    # server {
    #     listen 80;
    #     server_name crm.tudominio.com *.crm.tudominio.com;
    #     return 301 https://$host$request_uri;
    # }

    # ── Servidor HTTP (sin SSL — para empezar o si usas solo IP) ───────────
    server {
        listen 80;
        server_name _;   # acepta cualquier host / IP directa

        location / {
            proxy_pass         http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # La IA de Proyectos planifica un proyecto entero: son minutos de
            # reloj, no segundos (01/09/2026). Con el `proxy_read_timeout` de
            # fabrica --60 s-- nginx cortaba la conexion antes de que el modelo
            # terminara, y por pantalla se veia «Error interno del servidor».
            # El CRM manda ademas un latido mientras trabaja
            # (lib/ai/respuestaConLatido.js), que reinicia este contador; esto
            # es el cinturon por si algun dia se quita.
            proxy_read_timeout 310s;
            proxy_send_timeout 310s;
            # Sin acumular la respuesta: si nginx la guarda entera antes de
            # mandarla, el latido llega al final y no ha servido de nada.
            proxy_buffering off;
        }
    }

    # ── HTTPS con certificado (descomentar cuando tengas cert) ─────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name crm.tudominio.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     location / {
    #         proxy_pass         http://nextjs;
    #         proxy_http_version 1.1;
    #         proxy_set_header   Upgrade $http_upgrade;
    #         proxy_set_header   Connection 'upgrade';
    #         proxy_set_header   Host $host;
    #         proxy_set_header   X-Real-IP $remote_addr;
    #         proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header   X-Forwarded-Proto https;
    #         proxy_cache_bypass $http_upgrade;
    #     }
    # }
}
